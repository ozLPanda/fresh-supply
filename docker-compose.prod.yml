name: ovoshi-help-prod

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_shop}
      POSTGRES_USER: ${POSTGRES_USER:-company_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
    expose:
      - "5432"
    volumes:
      - company_shop_pg:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    pids_limit: 200
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 200
        reservations:
          memory: 512M

  embedding-service:
    <<: *service-defaults
    build:
      context: ./embedding-service
      dockerfile: Dockerfile.prod
      args:
        MODEL_NAME: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
    environment:
      MODEL_NAME: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      MODEL_DIR: /models/multilingual-e5-base
    expose:
      - "8000"
    networks:
      - services
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
          pids: 256
        reservations:
          memory: 1G

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the production environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the production environment}
    expose:
      - "9000"
    volumes:
      - company_shop_minio:/data
    networks:
      - services
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200
        reservations:
          memory: 256M

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction
    expose:
      - "6379"
    networks:
      - services
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 100
        reservations:
          memory: 64M

  backend:
    <<: *service-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-ovoshi_help_session}
      APP_SEO_SITE_URL: ${APP_SEO_SITE_URL:-}
      APP_SEO_GOOGLE_SITE_VERIFICATION: ${APP_SEO_GOOGLE_SITE_VERIFICATION:-}
      APP_SEO_YANDEX_VERIFICATION: ${APP_SEO_YANDEX_VERIFICATION:-}
      APP_SEO_TEMPLATE_URL: http://frontend:8080/index.html
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-company_shop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-company_shop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the production environment}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the production environment}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-company-shop-files}
      APP_PRICE_IMPORT_PYTHON: /opt/price-importer-venv/bin/python
      APP_PRICE_IMPORT_SCRIPT: /app/price-importer/price_importer.py
      APP_PRICE_IMPORT_TEMP_DIR: /tmp/company-shop-price-imports
      APP_DEPLOY_STATUS_DIR: /app/deploy-status
      APP_EMBEDDINGS_ENABLED: "true"
      APP_EMBEDDINGS_URL: http://embedding-service:8000
      APP_EMBEDDINGS_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      APP_EMBEDDINGS_DIMENSIONS: "768"
      APP_ALIBABA_SOURCING_PROVIDER: ${ALIBABA_SOURCING_PROVIDER:-html}
      APP_WEB_PUSH_PUBLIC_KEY: ${APP_WEB_PUSH_PUBLIC_KEY:-}
      APP_WEB_PUSH_PRIVATE_KEY: ${APP_WEB_PUSH_PRIVATE_KEY:-}
      APP_WEB_PUSH_SUBJECT: ${APP_WEB_PUSH_SUBJECT:-}
      APP_GPT_ENABLED: ${APP_GPT_ENABLED:-false}
      APP_GPT_MODEL: ${APP_GPT_MODEL:-gpt-6-luna}
      APP_GPT_REASONING_EFFORT: ${APP_GPT_REASONING_EFFORT:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_WHATSAPP_ACCESS_TOKEN: ${APP_WHATSAPP_ACCESS_TOKEN:-}
      APP_WHATSAPP_PHONE_NUMBER_ID: ${APP_WHATSAPP_PHONE_NUMBER_ID:-}
      APP_WHATSAPP_WABA_ID: ${APP_WHATSAPP_WABA_ID:-}
      APP_WHATSAPP_VERIFY_TOKEN: ${APP_WHATSAPP_VERIFY_TOKEN:-}
      APP_WHATSAPP_APP_SECRET: ${APP_WHATSAPP_APP_SECRET:-}
      APP_MKS_LOGIN: ${APP_MKS_LOGIN:-}
      APP_MKS_PASSWORD: ${APP_MKS_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS to the allowed browser origin or comma-separated origins}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?Set APP_BOOTSTRAP_ADMIN_PASSWORD to a unique value of at least 16 characters}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - /var/lib/ovoshi-help/deploy-status:/app/deploy-status:ro
    networks:
      - backend
      - seo-template
      - database
      - services
      - egress
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=2g,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:8080/actuator/health/liveness",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 45s
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
          pids: 512
        reservations:
          memory: 512M

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "8080"
    ports:
      - "127.0.0.1:18091:8080"
    networks:
      - frontend
      - seo-template
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 100
        reservations:
          memory: 32M

volumes:
  company_shop_pg:
  company_shop_minio:

networks:
  # Slot-local network: a backend must fetch the matching frontend app shell.
  seo-template:
    internal: true
  frontend:
  backend:
    internal: true
  database:
    internal: true
  services:
    internal: true
  egress:
