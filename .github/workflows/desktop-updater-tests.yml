name: Test desktop updates on native platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/src/**'
      - 'desktop/test/**'
      - 'desktop/package*.json'
      - '.github/workflows/desktop-updater-tests.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Test supervisor, transfer and native update helpers
        working-directory: desktop
        run: npm test
