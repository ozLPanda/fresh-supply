name: ovoshi-help

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: company_shop
      POSTGRES_USER: company_shop
      POSTGRES_PASSWORD: company_shop
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - company_shop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_shop -d company_shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  embedding-service:
    build: ./embedding-service
    environment:
      MODEL_NAME: intfloat/multilingual-e5-base
      MODEL_DIR: /models/multilingual-e5-base
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: company-shop
      MINIO_ROOT_PASSWORD: company-shop-local-password
    volumes:
      - company_shop_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    working_dir: /app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/company_shop
      SPRING_DATASOURCE_USERNAME: company_shop
      SPRING_DATASOURCE_PASSWORD: company_shop
      APP_SEO_TEMPLATE_URL: http://frontend:${FRONTEND_PORT:-5175}/index.html
      APP_UPLOAD_DIR: /app/uploads
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-ovoshi_help_session}
      SERVER_SERVLET_SESSION_COOKIE_NAME: ovoshi_help_servlet_session
      APP_ROTATE_SEED_ADMIN: ${APP_ROTATE_SEED_ADMIN:-false}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: company-shop
      APP_STORAGE_SECRET_KEY: company-shop-local-password
      APP_STORAGE_BUCKET: company-shop-files
      APP_EMBEDDINGS_ENABLED: "true"
      APP_EMBEDDINGS_URL: http://embedding-service:8000
      APP_EMBEDDINGS_MODEL: intfloat/multilingual-e5-base
      APP_EMBEDDINGS_DIMENSIONS: "768"
      APP_ALIBABA_SOURCING_PROVIDER: html
      APP_GPT_ENABLED: ${APP_GPT_ENABLED:-false}
      APP_GPT_MODEL: ${APP_GPT_MODEL:-gpt-6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_WEB_PUSH_PUBLIC_KEY: ${APP_WEB_PUSH_PUBLIC_KEY:-}
      APP_WEB_PUSH_PRIVATE_KEY: ${APP_WEB_PUSH_PRIVATE_KEY:-}
      APP_WEB_PUSH_SUBJECT: ${APP_WEB_PUSH_SUBJECT:-}
      APP_WHATSAPP_ACCESS_TOKEN: ${APP_WHATSAPP_ACCESS_TOKEN:-}
      APP_WHATSAPP_PHONE_NUMBER_ID: ${APP_WHATSAPP_PHONE_NUMBER_ID:-}
      APP_WHATSAPP_WABA_ID: ${APP_WHATSAPP_WABA_ID:-}
      APP_WHATSAPP_VERIFY_TOKEN: ${APP_WHATSAPP_VERIFY_TOKEN:-}
      APP_WHATSAPP_APP_SECRET: ${APP_WHATSAPP_APP_SECRET:-}
      APP_MKS_LOGIN: ${APP_MKS_LOGIN:-}
      APP_MKS_PASSWORD: ${APP_MKS_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5175,http://127.0.0.1:5175,http://localhost:8085,http://127.0.0.1:8085,https://localhost:8445}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8084}:8080"
    volumes:
      - ./backend:/app
      - company_shop_maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DEV_API_TARGET: http://backend:8080
      VITE_DEV_SERVER_PORT: ${FRONTEND_PORT:-5175}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5175}:${FRONTEND_PORT:-5175}"
    volumes:
      - ./frontend:/app
      - company_shop_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-5175}
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8085}:80"
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-8445}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - company_shop_caddy_data:/data
      - company_shop_caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  company_shop_pg:
  company_shop_maven_cache:
  company_shop_frontend_node_modules:
  company_shop_minio:
  company_shop_caddy_data:
  company_shop_caddy_config:
