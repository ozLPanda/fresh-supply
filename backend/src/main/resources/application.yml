server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/company_shop}
    username: ${SPRING_DATASOURCE_USERNAME:company_shop}
    password: ${SPRING_DATASOURCE_PASSWORD:company_shop}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2050MB
app:
  auth:
    rotate-seed-admin: ${APP_ROTATE_SEED_ADMIN:false}
    bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    cookie:
      name: ${APP_AUTH_COOKIE_NAME:company_shop_session}
      path: ${APP_AUTH_COOKIE_PATH:/}
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Strict}
      max-age-seconds: ${APP_AUTH_COOKIE_MAX_AGE_SECONDS:2592000}
  files:
    storage:
      endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
      access-key: ${APP_STORAGE_ACCESS_KEY:company-shop}
      secret-key: ${APP_STORAGE_SECRET_KEY:change-me-in-production}
      bucket: ${APP_STORAGE_BUCKET:company-shop-files}
  price-import:
    python-executable: ${APP_PRICE_IMPORT_PYTHON:python}
    script-path: ${APP_PRICE_IMPORT_SCRIPT:price-importer/price_importer.py}
    temp-dir: ${APP_PRICE_IMPORT_TEMP_DIR:${java.io.tmpdir}/company-shop-price-imports}
    timeout-seconds: ${APP_PRICE_IMPORT_TIMEOUT_SECONDS:600}
    max-file-size-bytes: ${APP_PRICE_IMPORT_MAX_FILE_SIZE_BYTES:2147483648}
    max-output-size-bytes: ${APP_PRICE_IMPORT_MAX_OUTPUT_SIZE_BYTES:52428800}
    max-rows: ${APP_PRICE_IMPORT_MAX_ROWS:10000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  embeddings:
    enabled: ${APP_EMBEDDINGS_ENABLED:false}
    url: ${APP_EMBEDDINGS_URL:http://localhost:8000}
    model: ${APP_EMBEDDINGS_MODEL:intfloat/multilingual-e5-base}
    dimensions: ${APP_EMBEDDINGS_DIMENSIONS:768}
    backfill-batch-size: ${APP_EMBEDDINGS_BACKFILL_BATCH_SIZE:50}
    search-max-distance: ${APP_EMBEDDINGS_SEARCH_MAX_DISTANCE:0.205}
  gpt:
    enabled: ${APP_GPT_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${APP_GPT_BASE_URL:https://api.openai.com/v1}
    model: ${APP_GPT_MODEL:gpt-6-luna}
    reasoning-effort: ${APP_GPT_REASONING_EFFORT:medium}
    connect-timeout: ${APP_GPT_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_GPT_READ_TIMEOUT:60s}
  alibaba-sourcing:
    provider: ${APP_ALIBABA_SOURCING_PROVIDER:stub}
    base-url: ${APP_ALIBABA_SOURCING_BASE_URL:https://www.alibaba.com/trade/search}
    connect-timeout: ${APP_ALIBABA_SOURCING_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_ALIBABA_SOURCING_READ_TIMEOUT:30s}
  web-push:
    public-key: ${APP_WEB_PUSH_PUBLIC_KEY:}
    private-key: ${APP_WEB_PUSH_PRIVATE_KEY:}
    subject: ${APP_WEB_PUSH_SUBJECT:}
  whatsapp:
    access-token: ${APP_WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${APP_WHATSAPP_PHONE_NUMBER_ID:}
    waba-id: ${APP_WHATSAPP_WABA_ID:}
    verify-token: ${APP_WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${APP_WHATSAPP_APP_SECRET:}
  mks:
    login: ${APP_MKS_LOGIN:}
    password: ${APP_MKS_PASSWORD:}
