server:
  shutdown: graceful

app:
  auth:
    rotate-seed-admin: true
    cookie:
      name: ${APP_AUTH_COOKIE_NAME:__Host-company_shop_session}
      secure: true
      same-site: Strict

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
